apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: visionai
type: Opaque
stringData:
  secret: ""
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: visionai
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: vision-ai-build-template
  namespace: visionai
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: vision-ai-build-
        namespace: visionai
      spec:
        pipelineRef:
          name: vision-ai-build
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
        workspaces:
          - name: source
            persistentVolumeClaim:
              claimName: vision-ai-build-source
          - name: registry-creds
            secret:
              secretName: quay-push-secret
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-listener
  namespace: visionai
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: body.ref == 'refs/heads/experiment/vision-ai'
      bindings:
        - ref: github-push-binding
      template:
        ref: vision-ai-build-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: github-webhook
  namespace: visionai
spec:
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: el-github-listener
