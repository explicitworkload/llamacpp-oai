apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: vision-ai-build-
  namespace: visionai
spec:
  pipelineRef:
    name: vision-ai-build
  timeouts:
    pipeline: "6h"
    tasks: "120m"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ocs-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 20Gi
    - name: registry-creds
      secret:
        secretName: quay-push-secret
