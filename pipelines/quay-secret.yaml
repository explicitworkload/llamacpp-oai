apiVersion: v1
kind: Secret
metadata:
  name: quay-push-secret
  namespace: visionai
  annotations:
    tekton.dev/docker-0: https://quay.io
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "quay.io": {
          "auth": "<base64-encoded username:password>"
        }
      }
    }
