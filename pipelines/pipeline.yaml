apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vision-ai-build
  namespace: visionai
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/explicitworkload/llamacpp-oai.git
    - name: git-revision
      type: string
      default: experiment/vision-ai
    - name: serving-image
      type: string
      default: registry-quay-app.quay.svc.cluster.local/visionai/visionai:latest
    - name: serving-cpu-image
      type: string
      default: registry-quay-app.quay.svc.cluster.local/visionai/visionai:cpu
    - name: app-image
      type: string
      default: registry-quay-app.quay.svc.cluster.local/visionai/visionai-app:latest
  workspaces:
    - name: source
    - name: registry-creds
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source

    - name: build-serving
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - clone
      params:
        - name: IMAGE
          value: $(params.serving-image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: registry-creds

    - name: build-serving-cpu
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - clone
      params:
        - name: IMAGE
          value: $(params.serving-cpu-image)
        - name: DOCKERFILE
          value: ./Dockerfile.cpu
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: registry-creds

    - name: build-app
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - clone
      params:
        - name: IMAGE
          value: $(params.app-image)
        - name: DOCKERFILE
          value: ./app/Dockerfile
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: registry-creds

    - name: restart-rollouts
      runAfter:
        - build-serving
        - build-serving-cpu
        - build-app
      taskSpec:
        steps:
          - name: rollout-restart
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -e
              echo "Restarting deployments in john namespace..."
              kubectl rollout restart deployment/vision-ai -n john
              kubectl rollout restart deployment/rf-detr-predictor -n john || echo "rf-detr-predictor not found, skipping"
              kubectl rollout restart deployment/sam2-predictor -n john || echo "sam2-predictor not found, skipping"
              echo "Waiting for rollouts to complete..."
              kubectl rollout status deployment/vision-ai -n john --timeout=120s
              kubectl rollout status deployment/rf-detr-predictor -n john --timeout=300s || true
              kubectl rollout status deployment/sam2-predictor -n john --timeout=300s || true
              echo "Rollout restarts complete."
