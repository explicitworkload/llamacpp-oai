# The litellm-postgres Secret is deliberately NOT defined here. It held a plaintext
# password, and keeping it in this file means any `oc apply -f postgres.yaml` would
# overwrite the live credential and break the running database.
#
# Create it once, out of band:
#
#   oc create secret generic litellm-postgres -n litellm \
#     --from-literal=POSTGRES_USER=litellm \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=POSTGRES_DB=litellm
#
# The same password appears inside DATABASE_URL in litellm-proxy-secrets; rotate both
# together.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-postgres-pvc
  labels:
    app: litellm-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-postgres
  labels:
    app: litellm-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm-postgres
  template:
    metadata:
      labels:
        app: litellm-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: litellm-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-postgres
  labels:
    app: litellm-postgres
spec:
  selector:
    app: litellm-postgres
  ports:
    - port: 5432
      targetPort: 5432
