apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vision-ai-isvc-access
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vision-ai-isvc-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vision-ai-isvc-access
subjects:
  - kind: ServiceAccount
    name: models-odf-s3-sa
    namespace: john
