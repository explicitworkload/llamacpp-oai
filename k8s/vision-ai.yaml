apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-ai
  namespace: john
  labels:
    app: vision-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-ai
  template:
    metadata:
      labels:
        app: vision-ai
    spec:
      serviceAccountName: models-odf-s3-sa
      containers:
        - name: vision-ai
          image: registry-quay-app.quay.svc.cluster.local/visionai/visionai-app:latest
          imagePullPolicy: Always
          env:
            - name: INFERENCE_URL
              value: http://rf-detr-predictor.john.svc.cluster.local
            - name: MODEL_NAME
              value: rf-detr
            - name: SAM2_URL
              value: http://sam2-predictor.john.svc.cluster.local
            - name: SAM2_MODEL_NAME
              value: sam2
            - name: RTSP_URL
              value: rtsp://172.16.199.10:554/stream1
            - name: CONF_THRESHOLD
              value: "0.25"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m`
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vision-ai
  namespace: john
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: vision-ai
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vision-ai
  namespace: john
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: vision-ai
