apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-ai
  namespace: john
  labels:
    app: vision-ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: vision-ai
  template:
    metadata:
      labels:
        app: vision-ai
    spec:
      serviceAccountName: models-odf-s3-sa
      containers:
        - name: vision-ai
          image: quay.apps.snuc.kubernetes.day/visionai/visionai-app:latest
          imagePullPolicy: Always
          env:
            - name: INFERENCE_URL
              value: rf-detr-grpc.john.svc.cluster.local:8001
            - name: MODEL_NAME
              value: model
            - name: SAM2_URL
              value: sam2-grpc.john.svc.cluster.local:8001
            - name: SAM2_MODEL_NAME
              value: model
            - name: RTSP_URL
              valueFrom:
                secretKeyRef:
                  name: rtsp-credentials
                  key: RTSP_URL
            - name: CONF_THRESHOLD
              value: "0.25"
            - name: INPUT_SIZE
              value: "560"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vision-ai
  namespace: john
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: vision-ai
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vision-ai
  namespace: john
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: vision-ai
