apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-rollout-restart
  namespace: john
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-rollout-restart
  namespace: john
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-rollout-restart
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: visionai
